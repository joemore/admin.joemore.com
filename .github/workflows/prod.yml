name: Build and push admin image (prod)

on:
  push:
    branches: ["prod"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Prevent concurrent jobs from writing the production image tags at once.
concurrency:
  group: admin-production-image
  cancel-in-progress: false

jobs:
  build:
    # A manual run from another branch must never overwrite the prod image.
    if: github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check required build configuration
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [[ -z "$NEXT_PUBLIC_SUPABASE_URL" || -z "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" ]]; then
            echo 'Add NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY to the repository Actions secrets.' >&2
            exit 1
          fi

      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/admin-joemore-com" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and load image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: ${{ steps.image.outputs.name }}:ci
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

      - name: Smoke-test the container before publishing
        env:
          IMAGE: ${{ steps.image.outputs.name }}:ci
        run: |
          set -euo pipefail
          container=admin-image-smoke
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker run --detach --name "$container" "$IMAGE" >/dev/null
          docker cp scripts/smoke.mjs "$container:/tmp/admin-smoke.mjs"
          ready=false
          for attempt in {1..30}; do
            if docker exec "$container" node -e 'fetch("http://127.0.0.1:3000/login").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            echo 'The admin container did not become ready.' >&2
            docker logs "$container"
            exit 1
          fi
          docker exec "$container" node /tmp/admin-smoke.mjs --expect-configured

      - name: Push commit and prod tags
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          docker tag "$IMAGE:ci" "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:$GITHUB_SHA"
          docker tag "$IMAGE:ci" "$IMAGE:prod"
          docker push "$IMAGE:prod"
